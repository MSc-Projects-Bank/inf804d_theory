<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INF804D Theory Trainer</title>
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface2:#efede6; --text:#1c1c1a; --muted:#696861;
  --border:#dad7cd; --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e2edf5;
  --good:#1d7444; --good-bg:#e1f2e7; --part:#8a5d00; --part-bg:#fbefd2; --bad:#b02a20; --bad-bg:#fbe5e2;
  --code-bg:#f2f0ea; --mark:#ffeb8a; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1d1d1b; --surface2:#272725; --text:#ebeae4; --muted:#a2a19a;
    --border:#3a3935; --accent:#6eaedc; --accent-ink:#0c1a24; --accent-soft:#1d2e3b;
    --good:#6fcf97; --good-bg:#15301f; --part:#e8b64f; --part-bg:#382c10; --bad:#f28b82; --bad-bg:#3a1916;
    --code-bg:#22221f; --mark:#5d4f10; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1d1d1b; --surface2:#272725; --text:#ebeae4; --muted:#a2a19a;
  --border:#3a3935; --accent:#6eaedc; --accent-ink:#0c1a24; --accent-soft:#1d2e3b;
  --good:#6fcf97; --good-bg:#15301f; --part:#e8b64f; --part-bg:#382c10; --bad:#f28b82; --bad-bg:#3a1916;
  --code-bg:#22221f; --mark:#5d4f10; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
code,pre,textarea.code{font-family:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;letter-spacing:.2px;cursor:pointer}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--surface2)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:14px}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}
.lead{color:var(--muted);max-width:760px;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
.card .meta{font-size:14px;color:var(--muted);margin:2px 0 12px}
.card ul{margin:0 0 14px;padding-left:18px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.howto{margin-top:22px}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:4px 0}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.exam{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.nav{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.nav h4{margin:10px 6px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.nav h4:first-child{margin-top:2px}
.nav button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:transparent;color:var(--text);padding:6px 8px;border-radius:6px;font-size:14px}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border);flex:none}
.dot.ans{background:var(--muted);border-color:var(--muted)}
.dot.good{background:var(--good);border-color:var(--good)}
.dot.part{background:var(--part);border-color:var(--part)}
.dot.bad{background:var(--bad);border-color:var(--bad)}
.nav .mk{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;box-shadow:var(--shadow)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}
.context{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.qtext{font-size:17px;margin:0 0 12px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);vertical-align:middle}
.hint{font-size:13px;color:var(--muted);margin:4px 0 8px}
textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface);color:var(--text);font:inherit;line-height:1.5}
textarea.code{font-size:14px;min-height:260px;background:var(--code-bg);tab-size:2;white-space:pre}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.fields{border-collapse:collapse;margin:6px 0;width:100%;max-width:520px}
.fields td{padding:6px 8px;border-bottom:1px solid var(--border)}
.fields input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.actions .spacer{flex:1}
.fb{margin-top:18px;border-top:1px solid var(--border);padding-top:16px}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.score b{font-size:28px;font-variant-numeric:tabular-nums}
.band{font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px}
.band.good{background:var(--good-bg);color:var(--good)}
.band.part{background:var(--part-bg);color:var(--part)}
.band.bad{background:var(--bad-bg);color:var(--bad)}
.items{list-style:none;margin:0;padding:0}
.items li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
.items .tag{font-size:12px;font-weight:700;text-align:center;border-radius:5px;padding:2px 0;align-self:start}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.part{background:var(--part-bg);color:var(--part)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.items .pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.items .why{display:block;font-size:13px;color:var(--muted)}
.pickhead{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 2px}
.note{font-size:14px;background:var(--surface2);border-radius:8px;padding:10px 12px;margin:10px 0}
.note.warn{background:var(--part-bg)}
.yours{white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:12px;font-size:15px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600}
.model{margin-top:8px;font-size:15px}
.model p{margin:6px 0}
.model ul{margin:6px 0;padding-left:20px}
pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto;font-size:13.5px;line-height:1.45;margin:8px 0}
.mt{border-collapse:collapse;font-size:14px;margin:8px 0}
.mt td,.mt th{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
.mock{display:inline-block;border:1px solid var(--border);border-radius:8px;padding:14px 18px;background:var(--surface2);margin:4px 0 8px;font-size:15px}
.mock .r{margin:6px 0}
.mock .in{display:inline-block;min-width:150px;border:1px solid var(--muted);background:var(--surface);padding:1px 6px;margin-left:6px}
.mock .b{display:inline-block;border:1px solid var(--muted);background:var(--surface);padding:2px 10px;margin-right:6px;border-radius:3px}
.mock table td{padding:4px 8px}
.mock .lbl{text-align:right;font-weight:600}
.res-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.res-q{border:1px solid var(--border);border-radius:8px;margin:8px 0;background:var(--surface)}
.res-q > summary{display:grid;grid-template-columns:1fr 120px 70px;gap:12px;align-items:center;padding:10px 14px;font-weight:500}
.res-q > div{padding:0 14px 14px}
.res-q .sc{text-align:right;font-variant-numeric:tabular-nums}
.runner-box{position:absolute;left:-10000px;top:0;width:900px;height:700px;overflow:hidden}
.runner-box iframe{width:900px;height:700px;border:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:820px){
  .exam{grid-template-columns:1fr}
  .nav{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:4px}
  .nav h4{width:100%;margin:6px 4px 0}
  .nav button{width:auto;background:var(--surface2)}
  .nav .mk{display:none}
  .items li{grid-template-columns:60px 1fr}
  .items .pts{grid-column:2}
  .res-q > summary{grid-template-columns:1fr 70px}
  .res-q .bar{display:none}
  .qcard{padding:16px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" data-act="home">INF804D Theory Trainer<small>Web Application and Development · Section B</small></div>
  <div class="spacer"></div>
  <span id="timer"></span>
  <button class="btn sm" id="homeBtn" data-act="home" hidden>⌂ Home</button>
  <button class="btn sm ghost" data-act="theme" title="Toggle light/dark">◐</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="runner-box" id="runnerBox" aria-hidden="true"></div>

<script>
/* =====================================================================
   1. TEXT MATCHING ENGINE
   Normalises words (case, plurals, -ing/-ed/-tion endings), tolerates
   small typos, matches multi-word phrases with a little slack, and
   measures overall similarity to the model answer.
   ===================================================================== */
const STOP = new Set(('a an the and or of to in on for is are was were be been being it its this that these those with as by at from into than then so such can could will would should may might must do does did done has have had but if which who whom what when where why how also there their they them we our you your he she his her i me my us very more most other some any each all both few many much one two three per via about out up over under again only own same too just way like etc e g eg ie').split(' '));
const CANON = {js:'javascript', db:'database', dbs:'database', pwd:'password', info:'information', ux:'experience', ui:'interface', btn:'button', func:'function', fn:'function', diff:'different', req:'request', msg:'message', msgs:'messages', html5:'html'};
const SUF = [['ization','iz'],['isation','iz'],['ational','at'],['ations','at'],['ation','at'],['ically','ic'],['ally',''],['ingly',''],['ings',''],['ing',''],['edly',''],['ied','y'],['ies','y'],['ed',''],['es',''],['s',''],['ly',''],['ment',''],['ness','']];

function stem(w){
  if (w.length <= 3 || /^\d/.test(w)) return w;
  for (const [suf, rep] of SUF){
    if (!w.endsWith(suf)) continue;
    if (suf === 'es' && !/(ss|x|z|ch|sh)es$/.test(w)) continue;
    if (suf === 's' && /(ss|us|is)$/.test(w)) continue;
    const base = w.slice(0, -suf.length) + rep;
    if (base.length >= (suf === 'ing' ? 4 : 3)){ w = base; break; }
  }
  if (w.length > 4 && w.endsWith('e')) w = w.slice(0, -1);
  if (w.length > 4 && /([bcdfgkmnprt])\1$/.test(w)) w = w.slice(0, -1);
  return w;
}

function tokenize(text){
  const low = String(text).toLowerCase().replace(/e-mail/g, 'email ');
  const out = []; const re = /[a-z0-9]+/g; let m;
  while ((m = re.exec(low))){
    const w = CANON[m[0]] || m[0];
    out.push({w, s: stem(w), i: m.index, n: m[0].length});
  }
  return out;
}

function lev(a, b, cap){
  if (Math.abs(a.length - b.length) > cap) return cap + 1;
  let prev = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++){
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > cap) return cap + 1;
    prev = cur;
  }
  return prev[b.length];
}

function tokMatch(a, b){
  if (a === b) return true;
  const isNum = /^\d+$/;
  if (isNum.test(a) || isNum.test(b)) return false;
  const short = a.length <= b.length ? a : b, long = short === a ? b : a;
  if (short.length >= 5 && long.startsWith(short)) return true;
  if (a.length >= 5 && b.length >= 5){
    const d = lev(a, b, 2);
    if (d <= 1) return true;
    if (d <= 2 && a.length >= 9 && b.length >= 9) return true;
  }
  return false;
}

const termCache = new Map();
function termToks(term){
  if (!termCache.has(term)) termCache.set(term, tokenize(term).map(t => t.s));
  return termCache.get(term);
}

/* returns array of matched answer-token indexes, or null */
function findTerm(term, toks){
  const tt = termToks(term);
  if (!tt.length) return null;
  for (let i = 0; i < toks.length; i++){
    if (!tokMatch(tt[0], toks[i].s)) continue;
    const hit = [i]; let j = i, ok = true;
    for (let k = 1; k < tt.length; k++){
      let found = -1;
      for (let x = j + 1; x <= Math.min(j + 3, toks.length - 1); x++){
        if (tokMatch(tt[k], toks[x].s)){ found = x; break; }
      }
      if (found < 0){ ok = false; break; }
      hit.push(found); j = found;
    }
    if (ok) return hit;
  }
  return null;
}

function bag(text, ignore){
  const m = new Map();
  for (const t of tokenize(text)){
    if (STOP.has(t.w) || t.s.length < 3 || (ignore && ignore.has(t.s))) continue;
    m.set(t.s, (m.get(t.s) || 0) + 1);
  }
  return m;
}
function cosine(a, b){
  let dot = 0, na = 0, nb = 0;
  for (const [k, v] of a){ na += v*v; if (b.has(k)) dot += v * b.get(k); }
  for (const v of b.values()) nb += v*v;
  return na && nb ? dot / Math.sqrt(na * nb) : 0;
}

/* =====================================================================
   2. CODE RUNNERS
   Plain JavaScript runs in a Web Worker with prompt/alert/document.write
   replaced by test doubles. HTML pages run in a sandboxed iframe where a
   harness fills the form, clicks buttons and reports what happened.
   ===================================================================== */
/* iOS/macOS "smart punctuation" turns quotes and -- into typographic characters that break code */
function fixSmart(s){
  return String(s).replace(/[“”„″]/g, '"').replace(/[‘’‚′]/g, "'")
    .replace(/—/g, '--').replace(/[–−]/g, '-').replace(/ /g, ' ');
}
function stripScript(code){ return String(code).replace(/<\/?script[^>]*>/gi, ''); }
function wrapScript(code){ return /<script/i.test(code) ? code : '<script>\n' + code + '\n<\/script>'; }

function workerMain(){
  self.onmessage = function(e){
    var d = e.data, out = [], qi = 0, inputs = d.inputs || [];
    function S(v){ try { return typeof v === 'string' ? v : (v && typeof v === 'object' ? JSON.stringify(v) : String(v)); } catch(_){ return String(v); } }
    function el(){
      var o = { value: '', style: {}, addEventListener: function(){}, appendChild: function(){}, setAttribute: function(){} };
      ['innerHTML','textContent','innerText'].forEach(function(k){
        Object.defineProperty(o, k, { set: function(v){ out.push(S(v)); }, get: function(){ return ''; } });
      });
      return o;
    }
    var g = {
      prompt: function(m, def){ return qi < inputs.length ? String(inputs[qi++]) : (def === undefined ? null : String(def)); },
      alert: function(m){ out.push(S(m)); },
      confirm: function(){ return true; },
      console: { log: function(){ out.push(Array.prototype.map.call(arguments, S).join(' ')); } },
      document: {
        write: function(){ out.push(Array.prototype.join.call(arguments, '')); },
        getElementById: el, querySelector: el, createElement: el, body: el()
      }
    };
    g.console.error = g.console.warn = g.console.info = g.console.log;
    g.document.writeln = g.document.write;
    g.window = g;
    var names = [], m,
        re = /function\s+([A-Za-z_$][\w$]*)|(?:var|let|const)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:function|\([^)]*\)\s*=>|[A-Za-z_$][\w$]*\s*=>)/g;
    while ((m = re.exec(d.code))){ var n = m[1] || m[2]; if (names.indexOf(n) < 0) names.push(n); }
    var ret = 'return {' + names.map(function(n){ return JSON.stringify(n) + ':(typeof ' + n + "!=='undefined'?" + n + ':undefined)'; }).join(',') + '};';
    var fns = {}, error = null;
    try {
      var f = new Function('prompt','alert','confirm','console','document','window', d.code + '\n;' + ret);
      fns = f(g.prompt, g.alert, g.confirm, g.console, g.document, g) || {};
    } catch(err){ error = String(err && err.message || err); }
    var calls = [];
    if (d.calls){
      Object.keys(fns).forEach(function(n){
        if (typeof fns[n] !== 'function') return;
        d.calls.forEach(function(args){
          var mark = out.length, r, ce = null;
          try { r = fns[n].apply(null, args); } catch(err){ ce = String(err && err.message || err); }
          calls.push({ name: n, args: args, ret: r === undefined ? null : S(r), out: out.slice(mark).join('\n'), error: ce });
        });
      });
    }
    postMessage({ out: out, error: error, calls: calls, names: names });
  };
}

function runJS(code, opts){
  return new Promise(resolve => {
    let w;
    try {
      w = new Worker(URL.createObjectURL(new Blob(['(' + workerMain.toString() + ')()'], {type: 'text/javascript'})));
    } catch (e){ resolve({error: 'Browser blocked the code runner: ' + e.message, out: [], calls: []}); return; }
    const t = setTimeout(() => { w.terminate(); resolve({error: 'Code did not finish within 2 seconds (infinite loop?).', out: [], calls: []}); }, 2000);
    w.onmessage = e => { clearTimeout(t); w.terminate(); resolve(e.data); };
    w.onerror = e => { e.preventDefault(); clearTimeout(t); w.terminate(); resolve({error: e.message, out: [], calls: []}); };
    w.postMessage({code: stripScript(code), inputs: opts.inputs || [], calls: opts.calls || null});
  });
}

const PAGE_MOCK = "window.__alerts=[];window.__errors=[];window.__submits=0;var __q=['7','4','7','4','7','4'];" +
  "window.alert=function(m){__alerts.push(String(m));};window.confirm=function(m){__alerts.push(String(m));return true;};" +
  "window.prompt=function(m,d){return __q.length?__q.shift():(d==null?null:String(d));};" +
  "window.addEventListener('error',function(e){__errors.push(e.message);});" +
  "HTMLFormElement.prototype.submit=function(){window.__submits++;};";

function pageHarness(tag, mode, opt){
  var A = function(s){ return [].slice.call(document.querySelectorAll(s)); };
  function bodyText(){ return document.body ? document.body.innerText : ''; }
  function pageText(){ return bodyText() + ' ' + A('input,textarea,output').map(function(i){ return i.value; }).join(' ') + ' ' + window.__alerts.join(' '); }
  function send(r){ r.errors = (window.__errors || []).slice(0, 3); parent.postMessage({tag: tag, result: r}, '*'); }
  function userFns(re){
    var skip = /^(alert|prompt|confirm|__)/;
    return Object.keys(window).filter(function(k){
      try { return re.test(k) && !skip.test(k) && typeof window[k] === 'function'; } catch(_){ return false; }
    }).map(function(k){ return window[k]; });
  }
  function label(el){
    var t = (el.id || '') + ' ' + (el.name || '') + ' ' + (el.placeholder || '');
    if (el.id){ var l = document.querySelector('label[for="' + (window.CSS && CSS.escape ? CSS.escape(el.id) : el.id) + '"]'); if (l) t += ' ' + l.textContent; }
    var p = el.closest('label'); if (p) t += ' ' + p.textContent;
    var row = el.closest('tr'); if (row) t += ' ' + row.textContent;
    var prev = el.previousSibling, k = 0;
    while (prev && k < 4){
      if (prev.nodeType === 1 && /^(INPUT|SELECT|TEXTAREA)$/.test(prev.tagName)) break;
      if (prev.textContent) t += ' ' + prev.textContent;
      prev = prev.previousSibling; k++;
    }
    return t;
  }
  function fields(){
    var els = A('input,select,textarea').filter(function(i){ return ['hidden','submit','button','reset','image'].indexOf((i.type || '').toLowerCase()) < 0; });
    var labs = els.map(label), used = [];
    function pick(re, not){
      for (var k = 0; k < els.length; k++){
        var t = labs[k]; if (not) t = t.replace(not, ' ');
        if (re.test(t) && used.indexOf(els[k]) < 0){ used.push(els[k]); return els[k]; }
      }
      return null;
    }
    var f = {};
    f.username = pick(/user/i);
    f.email = pick(/e-?mail/i);
    f.password = pick(/pass/i);
    f.company = pick(/company|organi[sz]ation|business/i);
    f.country = pick(/country|nation/i) || A('select')[0] || null;
    f.name = pick(/name/i, /user\s*-?name|company\s*name/ig);
    f.all = els;
    return f;
  }
  function fire(el){ ['input','change'].forEach(function(t){ el.dispatchEvent(new Event(t, {bubbles: true})); }); }

  function calc(){
    var texts = A('input').filter(function(i){ var t = (i.getAttribute('type') || 'text').toLowerCase(); return ['text','number','tel',''].indexOf(t) >= 0 && !i.readOnly; });
    var btns = A('button,input[type=button],input[type=submit]');
    var lab = function(b){ return ((b.value || '') + ' ' + (b.textContent || '')).trim(); };
    var mul = btns.filter(function(b){ return /mul|times|product|×|\*/i.test(lab(b)); })[0];
    var div = btns.filter(function(b){ return /div|quotient|÷|\//i.test(lab(b)); })[0];
    var bt = bodyText() + ' ' + texts.map(function(i){ return i.placeholder || ''; }).join(' ');
    var c = { twoInputs: texts.length >= 2, buttons: !!(mul && div), labels: /1st|first/i.test(bt) && /2nd|second/i.test(bt), resultLabel: /result/i.test(bt) };
    window.addEventListener('submit', function(e){ e.preventDefault(); });
    if (texts.length >= 2){ texts[0].value = '7'; texts[1].value = '4'; fire(texts[0]); fire(texts[1]); }
    var has28 = function(){ return /(^|[^\d.])28(?!\d)/.test(pageText()); };
    var has175 = function(){ return /1\.75/.test(pageText()); };
    if (mul){ try { mul.click(); } catch(_){} }
    if (!has28() && opt.fallback){
      userFns(/mul|product|times/i).forEach(function(fn){
        if (has28()) return;
        try { fn(); } catch(_){}
        if (!has28()){ try { var r = fn(7, 4); if (String(r) === '28') window.__alerts.push('28'); } catch(_){} }
      });
    }
    c.multiply = has28();
    if (div){ try { div.click(); } catch(_){} }
    if (!has175() && opt.fallback){
      userFns(/div|quot/i).forEach(function(fn){
        if (has175()) return;
        try { fn(); } catch(_){}
        if (!has175()){ try { var r = fn(7, 4); if (String(r) === '1.75') window.__alerts.push('1.75'); } catch(_){} }
      });
    }
    c.divide = has175();
    return { cases: c };
  }

  function setup(){
    var f = fields(), sel = A('select')[0];
    var heads = A('h1,h2,h3,h4,h5,legend,caption').map(function(e){ return e.textContent; }).join(' ');
    var bt = bodyText();
    return { cases: {
      form: !!document.querySelector('form'),
      heading: /set\s*-?\s*up\s+your\s+account/i.test(heads),
      note: /valid\s+e-?mail|verify/i.test(bt),
      name: !!f.name, email: !!f.email, emailType: !!(f.email && f.email.type === 'email'),
      username: !!f.username, password: !!f.password, passwordType: !!(f.password && f.password.type === 'password'),
      company: !!f.company,
      select: !!(sel && sel.options.length >= 2),
      usa: !!(sel && /united\s+states|usa|america/i.test(sel.textContent)),
      labels4: A('label').length >= 4,
      submit: A('button,input[type=submit]').length > 0
    } };
  }

  function validate(){
    var f = fields(), form = document.querySelector('form');
    if (!f.all.length) return { cases: {}, error: 'No form fields were found on the page.' };
    if (form && !form.getAttribute('onsubmit')){
      var sb = form.querySelector('button,input[type=submit]');
      if (!(sb && sb.getAttribute('onclick'))){
        var vf = userFns(/valid/i)[0];
        if (vf) form.onsubmit = function(){ return vf(); };
      }
    }
    var subs = 0, prevented = false, invalid = 0;
    document.addEventListener('invalid', function(){ invalid++; }, true);
    window.addEventListener('submit', function(e){ subs++; prevented = e.defaultPrevented; e.preventDefault(); });
    function attempt(){
      subs = 0; prevented = false; invalid = 0;
      var a0 = window.__alerts.length, t0 = bodyText(), s0 = window.__submits;
      var btn = (form || document).querySelector('input[type=submit],button:not([type]),button[type=submit]');
      try {
        if (btn) btn.click();
        else if (form && form.requestSubmit) form.requestSubmit();
        else { var b = document.querySelector('button,input[type=button]'); if (b) b.click(); }
      } catch(_){}
      var passed = (subs > 0 && !prevented && invalid === 0) || window.__submits > s0;
      var blocked = !passed && ((subs > 0 && prevented) || invalid > 0 || window.__alerts.length > a0 || bodyText() !== t0);
      return { passed: passed, blocked: blocked };
    }
    function setAll(vals){
      f.all.forEach(function(el){
        var t = (el.type || '').toLowerCase();
        if (t === 'checkbox' || t === 'radio'){ el.checked = !!vals.__checks; fire(el); return; }
        if (el.tagName === 'SELECT'){
          if (vals.__select){ for (var k = 0; k < el.options.length; k++){ if (el.options[k].value){ el.selectedIndex = k; break; } } }
          else { var empty = -1; for (var j = 0; j < el.options.length; j++){ if (!el.options[j].value){ empty = j; break; } } if (empty >= 0) el.selectedIndex = empty; }
          fire(el); return;
        }
        el.value = vals.__other; fire(el);
      });
      ['name','email','username','password','company'].forEach(function(k){ if (f[k] && vals[k] !== undefined){ f[k].value = vals[k]; fire(f[k]); } });
    }
    var good = { name: 'Kofi Mensah', email: 'kofi@ucc.edu.gh', username: 'kofimensah', password: 'Abcdef12', company: 'UCC', __other: 'Test value', __select: true, __checks: true };
    setAll({ name: '', email: '', username: '', password: '', company: '', __other: '', __select: false, __checks: false });
    var r1 = attempt();
    var bad = {}; for (var k in good) bad[k] = good[k]; bad.email = 'bad@';
    setAll(bad);
    var r2 = attempt();
    setAll(good);
    var r3 = attempt();
    return { cases: { emptyBlocked: r1.blocked, badEmail: r2.blocked, validPasses: r3.passed } };
  }

  function go(){
    // keep the test page from navigating away when a form is really submitted
    A('form').forEach(function(f){ f.setAttribute('action', '#'); f.setAttribute('method', 'get'); f.removeAttribute('target'); });
    try { send(mode === 'calc' ? calc() : mode === 'setup' ? setup() : validate()); }
    catch(e){ send({ cases: {}, error: 'Test harness error: ' + e.message }); }
  }
  if (document.readyState === 'complete') setTimeout(go, 30);
  else window.addEventListener('load', function(){ setTimeout(go, 30); });
}

function runPage(html, mode, opt){
  return new Promise(resolve => {
    const tag = 't' + Math.random().toString(36).slice(2);
    const box = document.getElementById('runnerBox');
    const fr = document.createElement('iframe');
    fr.setAttribute('sandbox', 'allow-scripts allow-forms');
    const pre = '<script>' + PAGE_MOCK + '<\/script>';
    const post = '<script>(' + pageHarness.toString() + ')(' + JSON.stringify(tag) + ',' + JSON.stringify(mode) + ',' + JSON.stringify(opt || {}) + ')<\/script>';
    let done = false;
    const finish = r => { if (done) return; done = true; window.removeEventListener('message', onMsg); clearTimeout(t); fr.remove(); resolve(r); };
    const onMsg = e => { if (e.data && e.data.tag === tag) finish(e.data.result); };
    const t = setTimeout(() => finish({cases: {}, error: 'The page did not respond within 4 seconds.'}), 4000);
    window.addEventListener('message', onMsg);
    fr.srcdoc = pre + html + post;
    box.appendChild(fr);
  });
}

function lastWith(out, a, b){
  for (let i = out.length - 1; i >= 0; i--){
    const s = String(out[i]);
    const ia = s.search(new RegExp('(^|[^\\d.])' + a + '(?![\\d])'));
    const ib = s.search(new RegExp('(^|[^\\d.])' + b + '(?![\\d])'));
    if (ia >= 0 && ib >= 0) return {s, ia, ib};
  }
  const s = out.join(' ');
  return {s, ia: s.search(new RegExp('(^|[^\\d.])' + a + '(?![\\d])')), ib: s.search(new RegExp('(^|[^\\d.])' + b + '(?![\\d])'))};
}

const RUNNERS = {
  async product(ans){
    const a = await runJS(ans, {inputs: ['6', '7']});
    const b = await runJS(ans, {inputs: ['2.5', '4']});
    return { cases: { runs: !a.error, p42: /(^|[^\d.])42(?!\d)/.test(a.out.join('\n')), p10: /(^|[^\d.])10(?![\d])/.test(b.out.join('\n')) },
             error: a.error, log: [['Inputs 6 and 7', a.out], ['Inputs 2.5 and 4', b.out]] };
  },
  async sum(ans){
    const r = await runJS(ans, {inputs: ['10'], calls: [[10], [4]]});
    const all = r.out.join('\n');
    const callHas = (n, v) => r.calls.some(c => c.args[0] === n && !c.error && (c.ret === String(v) || new RegExp('(^|[^\\d.])' + v + '(?!\\d)').test(c.out)));
    const n10 = callHas(10, 55) || /(^|[^\d.])55(?!\d)/.test(all);
    const n4 = callHas(4, 10);
    return { cases: { runs: !r.error, n10, n4 }, error: r.error,
             log: [['Program output', r.out]].concat(r.calls.map(c => ['Called ' + c.name + '(' + c.args.join(',') + ')', [c.out || ('returned ' + c.ret)]])) };
  },
  async ascending(ans){
    const r1 = await runJS(ans, {inputs: ['9', '4']});
    const r2 = await runJS(ans, {inputs: ['3', '8']});
    const r3 = await runJS(ans, {inputs: ['10', '9']});
    const ord = (r, lo, hi) => { const x = lastWith(r.out, lo, hi); return x.ia >= 0 && x.ib >= 0 && x.ia < x.ib; };
    return { cases: { runs: !r1.error, swap: ord(r1, 4, 9), keep: ord(r2, 3, 8), numeric: ord(r3, 9, 10) }, error: r1.error,
             log: [['Inputs 9 then 4', r1.out], ['Inputs 3 then 8', r2.out], ['Inputs 10 then 9', r3.out]] };
  },
  calcPage(ans){ return runPage(ans, 'calc', {}); },
  calcCombined(ans, all){
    let html, note;
    if (/<input/i.test(ans)) html = ans;
    else {
      const b = all.p2q4b || '';
      const useB = /<input/i.test(b);
      html = (useB ? b : DEFAULT_CALC) + wrapScript(ans);
      note = useB ? 'Your script was tested inside your own form from part B.' : 'Part B is empty, so your script was tested inside a standard form (ids num1, num2, result).';
    }
    return runPage(html, 'calc', {fallback: true}).then(r => (note && (r.note = note), r));
  },
  setupPage(ans){ return runPage(ans, 'setup', {}); },
  validateCombined(ans, all){
    let html, note;
    if (/<input/i.test(ans)) html = ans;
    else {
      const b = all.p2q3b || '';
      const useB = /<input/i.test(b);

  }
};

    function calculate(operation) {

        result = "Please enter two numbers";
      } else if (operation === "multiply") {
        result = a * b;
      } else {
        result = (b === 0) ? "Cannot divide by zero" : a / b;
      }
      document.getElementById("result").innerHTML = result;
    }
  <\/script>
</head>

    <input type="button" value="Divide"   onclick="calculate('divide')">

   4. MARKER
   ===================================================================== */
const half = x => Math.round(x * 2) / 2;
const quarter = x => Math.round(x * 4) / 4;

function scorePoint(p, ctx){
  if (p.kw){
    let hit = 0; const matched = [];
    for (const group of p.kw){
      let found = null;
      for (const term of group){
        const idx = findTerm(term, ctx.toks);
        if (idx){ found = term; idx.forEach(i => ctx.hl.add(i)); break; }
      }
      if (found){ hit++; matched.push(found); }
    }
    return {ratio: hit / p.kw.length, matched, missing: p.kw.filter((g, i) => !g.some(t => matched.includes(t))).map(g => g.slice(0, 3).join(' / '))};
  }
  if (p.re){
    const hits = p.re.filter(g => g.some(r => r.test(ctx.raw)));
    return {ratio: hits.length / p.re.length};
  }
  if (p.run){
    const cases = (ctx.run && ctx.run.cases) || {};
    const passed = p.run.filter(c => cases[c]);
    return {ratio: passed.length / p.run.length, cases: p.run.map(c => ({c, ok: !!cases[c]}))};
  }
  return {ratio: 0};
}

async function grade(q, answers){
  const ans = answers[q.id];
  if (q.kind === 'fields'){
    const vals = Array.isArray(ans) ? ans : [];
    const each = q.marks / q.fields.length;
    const items = q.fields.map((f, i) => {
      const v = String(vals[i] || '').trim().toLowerCase().replace(/["'\s]/g, '');
      const ok = f.ok.includes(v);
      return {label: f.label + ' &rarr; expected <b>' + f.ok[0] + '</b>' + (v ? ', you wrote <b>' + esc(vals[i]) + '</b>' : ', left blank'), marks: each, earned: ok ? each : 0, ratio: ok ? 1 : 0};
    });
    const score = items.reduce((s, x) => s + x.earned, 0);
    return {score, max: q.marks, items, empty: !vals.some(v => String(v || '').trim())};
  }
  const raw = q.kind === 'code' ? fixSmart(ans || '') : String(ans || '');
  if (!raw.trim()) return {score: 0, max: q.marks, empty: true, items: []};
  let run = null;
  if (q.runner) run = await RUNNERS[q.runner](raw, answers);
  const ctx = {raw, toks: tokenize(raw), hl: new Set(), run};
  const items = [];
  for (const block of q.rubric){
    if (block.pick){
      const scored = block.points.map(p => {
        const r = scorePoint(p, {raw, toks: ctx.toks, hl: new Set(), run});
        return {p, r};
      }).sort((a, b) => b.r.ratio - a.r.ratio);
      const chosen = scored.slice(0, block.pick).filter(x => x.r.ratio > 0);
      chosen.forEach(x => scorePoint(x.p, ctx));
      const rest = scored.filter(x => !chosen.includes(x));
      items.push({pick: true, label: block.label, need: block.pick, each: block.each,
        chosen: chosen.map(x => ({label: x.p.label, marks: block.each, earned: quarter(block.each * x.r.ratio), ratio: x.r.ratio, matched: x.r.matched, missing: x.r.missing})),
        others: rest.map(x => x.p.label)});
    } else {
      const r = scorePoint(block, ctx);
      items.push({label: block.label, marks: block.marks, earned: quarter(block.marks * r.ratio), ratio: r.ratio, matched: r.matched, missing: r.missing, cases: r.cases});
    }
  }
  let score = 0;
  for (const it of items) score += it.pick ? it.chosen.reduce((s, c) => s + c.earned, 0) : it.earned;
  const g = {score, max: q.marks, items, run, hl: ctx.hl, raw};
  if (q.kind === 'text'){
    const words = ctx.toks.length;
    // words copied from the question earn no similarity credit
    const qWords = new Set(tokenize((q.context || '') + ' ' + q.text.replace(/<[^>]+>/g, ' ')).map(t => t.s));
    const sim = cosine(bag(raw, qWords), bag(modelText(q), qWords));
    g.sim = sim;
    const est = Math.min(1, sim / 0.45) * q.marks;
    if (est > score) g.bonus = 0.15 * (est - score);
    if (q.minWords && words < q.minWords){
      g.short = true;
      score = score * Math.max(0.6, words / q.minWords);
    }
    score += g.bonus || 0;
  }
  g.score = Math.min(q.marks, half(score));
  return g;
}

function modelText(q){
  return q.model.map(b => typeof b === 'string' ? b : b.list ? b.list.join(' ') : b.table ? b.table.rows.map(r => r.join(' ')).join(' ') : '').join(' ').replace(/<[^>]+>/g, ' ');
}

function itemTag(ratio){ return ratio >= 0.999 ? ['good', 'Full'] : ratio > 0 ? ['part', 'Partial'] : ['bad', 'Missed']; }

function renderItem(it){
  const [cls, word] = itemTag(it.ratio);
  let why = '';
  if (it.matched && it.matched.length) why += `Found: ${it.matched.map(m => '"' + esc(m) + '"').join(', ')}. `;
  if (it.missing && it.missing.length && it.ratio < 1) why += `Missing an idea like: ${it.missing.map(m => '<i>' + esc(m) + '</i>').join('; ')}.`;
  if (it.cases) why += it.cases.map(c => (c.ok ? '✓ ' : '✗ ') + esc(CASE_LABELS[c.c] || c.c)).join(' · ');
  return `<li><span class="tag ${cls}">${word}</span><span>${it.label}${why ? `<span class="why">${why}</span>` : ''}</span><span class="pts">${fmt(it.earned)} / ${fmt(it.marks)}</span></li>`;
}

function highlight(raw, toks, hl){
  if (!hl || !hl.size) return esc(raw);
  let out = '', pos = 0;
  [...hl].sort((a, b) => a - b).forEach(i => {
    const t = toks[i]; if (!t || t.i < pos) return;
    out += esc(raw.slice(pos, t.i)) + '<mark>' + esc(raw.slice(t.i, t.i + t.n)) + '</mark>';
    pos = t.i + t.n;
  });
  return out + esc(raw.slice(pos));
}

    if (typeof b === 'string') return `<p>${b}</p>`;
    if (b.code) return `<pre><code>${esc(b.code)}</code></pre>`;
    if (b.list) return `<ul>${b.list.map(l => `<li>${l}</li>`).join('')}</ul>`;
    if (b.table) return `<table class="mt"><tr>${b.table.head.map(h => `<th>${h}</th>`).join('')}</tr>${b.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
    return '';
  }).join('');
}

function renderFeedback(q, g, openModel){
  if (g.empty) return `<div class="fb"><div class="score"><b>0 / ${q.marks}</b><span class="band bad">No answer</span></div><details ${openModel ? 'open' : ''}><summary>Model answer</summary><div class="model">${renderModel(q)}</div></details></div>`;
  const ratio = g.score / g.max, band = bandOf(ratio);
  let h = `<div class="fb"><div class="score"><b>${fmt(g.score)} / ${g.max}</b><span class="band ${band}">${Math.round(ratio * 100)}%</span></div><ul class="items">`;
  for (const it of g.items){
    if (it.pick){
      h += `</ul><div class="pickhead">${esc(it.label)} · counted ${it.chosen.length} of ${it.need}</div><ul class="items">`;
      h += it.chosen.map(renderItem).join('');
      for (let k = it.chosen.length; k < it.need; k++) h += `<li><span class="tag bad">Missed</span><span>Point ${k + 1} not found<span class="why">Other acceptable points: ${it.others.slice(0, 4).map(esc).join('; ')}</span></span><span class="pts">0 / ${fmt(it.each)}</span></li>`;
      h += `</ul><ul class="items">`;
    } else h += renderItem(it);
  }
  h += `</ul>`;
  if (g.bonus && g.bonus >= 0.25) h += `<div class="note">Similarity bonus: your answer is ${Math.round(g.sim * 100)}% similar in vocabulary to the model answer, so a little extra credit was added.</div>`;
  if (g.short) h += `<div class="note warn">This explanation is quite short for ${q.marks} marks, so the mark was scaled down. Add more detail.</div>`;
  if (g.run){
    if (g.run.note) h += `<div class="note">${esc(g.run.note)}</div>`;
    if (g.run.error) h += `<div class="note warn"><b>Code problem:</b> ${esc(g.run.error)}</div>`;
    if (g.run.errors && g.run.errors.length) h += `<div class="note warn"><b>Errors on your page:</b> ${g.run.errors.map(esc).join('; ')}</div>`;
    if (g.run.log) h += `<details><summary>What your program printed</summary>${g.run.log.map(([k, v]) => `<div class="hint" style="margin-top:8px">${esc(k)}</div><pre>${esc((v || []).join('\n') || '(nothing displayed)')}</pre>`).join('')}</details>`;
  }
  if (q.kind === 'text' && g.hl) h += `<details><summary>Your answer (words that earned marks highlighted)</summary><div class="yours" style="margin-top:8px">${highlight(g.raw, tokenize(g.raw), g.hl)}</div></details>`;
  h += `<details ${openModel ? 'open' : ''}><summary>Model answer</summary><div class="model">${renderModel(q)}</div></details></div>`;
  return h;
}

function saveDraft(){ store.set('inf804d-draft-' + S.paper, S.answers); }

async function checkCurrent(){
  const q = qs(S.paper)[S.idx];
  document.getElementById('fb').innerHTML = `<div class="fb"><span class="spin"></span> Marking${q.runner ? ' and running your code' : ''}...</div>`;
  const g = await grade(q, S.answers);
  S.fb[q.id] = g;
  renderExam();
  document.getElementById('fb').scrollIntoView({behavior: 'smooth', block: 'start'});
}

async function finish(){
  if (S.busy) return;
  S.busy = true; clearInterval(S.timer);
  app.innerHTML = `<div class="qcard"><span class="spin"></span> Marking the whole paper...</div>`;
  const list = qs(S.paper), out = {};
  for (const q of list) out[q.id] = await grade(q, S.answers);
  S.fb = out;
  const groups = {};
  list.forEach(q => { groups[q.group] = groups[q.group] || {name: q.group, score: 0, max: 0, qs: []}; groups[q.group].score += out[q.id].score; groups[q.group].max += q.marks; groups[q.group].qs.push(q); });
  let total = 0, max = 0, counted = Object.values(groups);
  if (S.paper === 2){
    const q1 = groups['Question 1 (compulsory)'];
    const others = counted.filter(g => g !== q1).sort((a, b) => b.score - a.score);
    counted = [q1, others[0], others[1]];
    others.slice(2).forEach(g => g.dropped = true);
  }
  counted.forEach(g => { total += g.score; max += g.max; });
  S.results = {groups: Object.values(groups), total, max};
  const hist = store.get('inf804d-history', []);
  hist.unshift({date: new Date().toLocaleString(), paper: S.paper, mode: S.mode, score: total, max});
  store.set('inf804d-history', hist.slice(0, 30));
  S.endAt = null; S.view = 'results'; S.busy = false;
  render(); window.scrollTo(0, 0);
}

function renderResults(){
  const R = S.results, ratio = R.total / R.max;
  app.innerHTML = `
  <div class="card">
    <div class="res-head">
      <div><div class="muted">${PAPERS[S.paper].title} · Section B</div><div class="big">${fmt(R.total)} <span class="muted" style="font-size:24px">/ ${R.max}</span></div></div>
      <div><span class="band ${bandOf(ratio)}" style="font-size:16px">${Math.round(ratio * 100)}%</span></div>
      <div class="spacer"></div>
      <div class="row"><button class="btn" data-act="review">Review answers</button><button class="btn primary" data-act="home">Back to papers</button></div>
    </div>
    ${S.paper === 2 ? '<p class="muted" style="margin-top:-6px;font-size:14px">Total = Question 1 + your best two of Questions 2, 3 and 4.</p>' : ''}
    ${R.groups.map(g => `<h3 style="margin-top:16px">${esc(g.name)} · ${fmt(g.score)} / ${g.max}${g.dropped ? ' <span class="chip">not counted</span>' : ''}</h3>
      ${g.qs.map(q => { const f = S.fb[q.id], r = f.score / f.max; return `<details class="res-q"><summary><span>Q${q.num}. ${q.text.replace(/<div class="mock"[\s\S]*$/, '').replace(/<[^>]+>/g, '')}</span><span class="bar"><i style="width:${Math.round(r * 100)}%"></i></span><span class="sc">${fmt(f.score)} / ${q.marks}</span></summary><div>${renderFeedback(q, f, false)}</div></details>`; }).join('')}`).join('')}
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, list = S.view === 'exam' ? qs(S.paper) : [];
  if (act === 'home'){
    if (S.view === 'home') return;
    if (S.view === 'exam' && S.mode === 'exam' && !confirm('Leave the timed exam? Your answers are saved, but the timer will stop.')) return;
    clearInterval(S.timer); S.endAt = null; S.view = 'home'; render(); }
  else if (act === 'theme'){
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx;
    try { localStorage.setItem('inf804d-theme', nx); } catch(_){}
  }
  else if (act === 'start') start(+b.dataset.paper, b.dataset.mode);
  else if (act === 'go'){ S.idx = +b.dataset.i; renderExam(); }
  else if (act === 'prev' && S.idx > 0){ S.idx--; renderExam(); }
  else if (act === 'next' && S.idx < list.length - 1){ S.idx++; renderExam(); }
  else if (act === 'check') checkCurrent();
  else if (act === 'model'){ const q = list[S.idx]; document.getElementById('fb').innerHTML = `<div class="fb"><details open><summary>Model answer</summary><div class="model">${renderModel(q)}</div></details></div>`; }
  else if (act === 'finish'){
    if (S.mode === 'exam' && !confirm('Finish the exam and mark all answers?')) return;
    finish();
  }
  else if (act === 'review'){ S.mode = 'practice'; S.view = 'exam'; S.idx = 0; render(); }
  else if (act === 'clear'){
    if (!confirm('Clear all your answers for this paper?')) return;
    S.answers = {}; S.fb = {}; saveDraft(); renderExam();
  }
});

document.addEventListener('input', e => {
  if (S.view !== 'exam') return;
  const q = qs(S.paper)[S.idx];
  if (e.target.id === 'ans'){ S.answers[q.id] = e.target.value; }
  else if (e.target.dataset.field !== undefined){
    const arr = Array.isArray(S.answers[q.id]) ? S.answers[q.id].slice() : [];
    arr[+e.target.dataset.field] = e.target.value; S.answers[q.id] = arr;
  } else return;
  if (S.fb[q.id]){ delete S.fb[q.id]; }
  saveDraft();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && e.target.matches && e.target.matches('textarea.code')){
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.setRangeText('  ', s, t.selectionEnd, 'end');
    t.dispatchEvent(new Event('input', {bubbles: true}));
  }
});

render();
</script>
